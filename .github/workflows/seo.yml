name: SEO checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci --no-audit --no-fund
      - name: Build static content from reviewed public snapshots
        run: npm run build
      - name: Check all generated pages, sitemap children and internal links
        run: npm run seo:check
      - name: Lighthouse mobile samples and SEO regression checks
        run: npm run seo:lighthouse
      - name: Keep Lighthouse reports with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile
          path: |
            reports/lighthouse/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 14
