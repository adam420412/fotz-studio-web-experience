name: SEO checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci --no-audit --no-fund
      - name: Build static content from reviewed public snapshots
        run: npm run build
      - name: Check all generated pages, sitemap children and internal links
        run: npm run seo:check
